<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri Notes E2E</title>
    <script>
      const workspace = {
        root: "C:\\e2e\\demo.note",
        title: "演示知识库",
        maps: [
          {
            id: "map-demo",
            title: "演示导图",
            root: {
              id: "node-root",
              title: "演示导图",
              hasDocument: false,
              children: [
                { id: "node-idea", title: "测试想法", hasDocument: true, children: [] },
              ],
            },
          },
        ],
      };
      const mindMap = {
        id: "map-demo",
        title: "演示导图",
        root: {
          id: "map:map-demo",
          title: "演示导图",
          hasDocument: false,
          documentId: null,
          headingBlockId: null,
          positionX: 0,
          positionY: 0,
          children: [
            {
              id: "node-idea",
              title: "测试想法",
              hasDocument: true,
              documentId: "map-demo/node-idea",
              headingBlockId: null,
              positionX: 180,
              positionY: 0,
              children: [],
            },
            {
              id: "node-heading",
              title: "测试标题",
              hasDocument: false,
              documentId: null,
              headingBlockId: "block_heading",
              positionX: 180,
              positionY: 140,
              children: [],
            },
          ],
        },
      };
      const outline = {
        title: "演示知识库",
        maps: [mindMap],
        unfiled: [],
      };

      // E2E starts from a mocked workspace. Real first launch stays empty.
      window.localStorage.setItem(
        "tauri-notes.session.v1",
        JSON.stringify({
          version: 1,
          roots: [workspace.root],
          activeRoot: workspace.root,
        }),
      );

      let callbackId = 1;
      const callbacks = new Map();
      window.__E2E_CALLS__ = [];

      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main" },
        },
        transformCallback(callback, once) {
          const id = callbackId++;
          callbacks.set(id, { callback, once });
          return id;
        },
        unregisterCallback(id) {
          callbacks.delete(id);
        },
        convertFileSrc(path) {
          return path;
        },
        async invoke(command, args) {
          window.__E2E_CALLS__.push(command);
          switch (command) {
            case "take_pending_note_file":
            case "startup_note_file":
              return null;
            case "help_note_path":
              return "C:\\e2e\\help.note";
            case "open_note_workspace":
            case "open_workspace":
              return workspace;
            case "load_outline":
              return outline;
            case "load_mind_map":
              return mindMap;
            case "list_imported_documents":
            case "load_document_tree":
            case "list_boards_db":
            case "search_blocks_db":
              return [];
            case "plugin_sdk_version":
              return 1;
            case "save_imported_blocks":
              return null;
            case "load_document_blocks":
              return [
                {
                  id: "block_demo",
                  documentId: "map-demo/node-idea",
                  blockType: "paragraph",
                  orderKey: "00000000",
                  widthSpan: 12,
                  heightMode: "auto",
                  heightPx: null,
                  contentJson: JSON.stringify({
                    type: "paragraph",
                    content: [{ type: "text", text: "用于插入视图的示例内容" }],
                  }),
                  plainText: "用于插入视图的示例内容",
                },
                {
                  id: "block_demo_2",
                  documentId: "map-demo/node-idea",
                  blockType: "paragraph",
                  orderKey: "00000001",
                  widthSpan: 12,
                  heightMode: "auto",
                  heightPx: null,
                  contentJson: JSON.stringify({
                    type: "paragraph",
                    content: [{ type: "text", text: "第二段示例内容" }],
                  }),
                  plainText: "第二段示例内容",
                },
                {
                  id: "block_heading",
                  documentId: "map-demo/node-idea",
                  blockType: "heading:1",
                  orderKey: "00000002",
                  widthSpan: 12,
                  heightMode: "auto",
                  heightPx: null,
                  contentJson: JSON.stringify({
                    type: "heading",
                    attrs: { level: 1 },
                    content: [{ type: "text", text: "测试标题" }],
                  }),
                  plainText: "测试标题",
                },
              ];
            case "create_document_for_map_node":
              return {
                id: args.nodeId,
                title: "测试标题",
                hasDocument: true,
                documentId: "map-demo/heading-doc",
                headingBlockId: "block_heading",
                positionX: 180,
                positionY: 140,
                children: [],
              };
            case "set_map_node_position":
              return null;
            case "load_blocks_preview": {
              const previews = [
                {
                  blockId: "block_demo",
                  documentId: "map-demo/node-idea",
                  documentTitle: "测试文档",
                  blockType: "paragraph",
                  contentJson: JSON.stringify({
                    type: "paragraph",
                    content: [{ type: "text", text: "用于插入视图的示例内容" }],
                  }),
                  plainText: "用于插入视图的示例内容",
                },
                {
                  blockId: "block_demo_2",
                  documentId: "map-demo/node-idea",
                  documentTitle: "测试文档",
                  blockType: "paragraph",
                  contentJson: JSON.stringify({
                    type: "paragraph",
                    content: [{ type: "text", text: "第二段示例内容" }],
                  }),
                  plainText: "第二段示例内容",
                },
              ];
              const requested = Array.isArray(args.blockIds) ? args.blockIds : [];
              return previews.filter((preview) =>
                requested.includes(preview.blockId),
              );
            }
            case "get_imported_document_title":
              return "测试文档";
            case "plugin:event|listen":
              return 1;
            case "plugin:event|unlisten":
              return null;
            case "plugin:window|set_title":
              return null;
            default:
              return null;
          }
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
