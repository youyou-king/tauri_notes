[workspace]
members = [".", "crates/*"]
resolver = "2"

[package]
name = "tauri-notes"
version = "0.1.1"
description = "Unified virtualized block editor for Markdown notes"
authors = ["Notes"]
edition = "2021"

[lib]
name = "tauri_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-notes-board = { path = "crates/board" }
tauri-notes-content = { path = "crates/content" }
tauri-notes-document = { path = "crates/document" }
tauri-notes-import = { path = "crates/import" }
tauri-notes-theme = { path = "crates/theme" }
tauri-notes-workspace = { path = "crates/workspace" }
tauri-notes-plugin-api = { path = "crates/plugin-api" }
tauri-notes-plugin-runtime = { path = "crates/plugin-runtime" }
tauri-notes-platform = { path = "crates/platform" }
tauri-notes-storage = { path = "crates/storage" }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
