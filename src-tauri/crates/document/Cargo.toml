[package]
name = "tauri-notes-document"
version = "0.1.0"
edition = "2021"
description = "Document and map persistence for Tauri Notes"

[lib]
name = "tauri_notes_document"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri-notes-storage = { path = "../storage" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "time"] }
