[package]
name = "tauri-notes-board"
version = "0.1.0"
edition = "2021"
description = "Board persistence for Tauri Notes"

[lib]
name = "tauri_notes_board"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri-notes-storage = { path = "../storage" }
