[package]
name = "tauri-notes-workspace"
version = "0.1.0"
edition = "2021"
description = "Workspace file, block and search operations for Tauri Notes"

[lib]
name = "tauri_notes_workspace"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri-notes-document = { path = "../document" }
tauri-notes-platform = { path = "../platform" }
tauri-notes-storage = { path = "../storage" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "time"] }
