[package]
name = "tauri-notes-storage"
version = "0.1.0"
edition = "2021"
description = "SQLite connection and migrations for Tauri Notes"

[lib]
name = "tauri_notes_storage"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt"] }
