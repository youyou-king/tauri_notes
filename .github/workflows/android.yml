name: android

on:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.0.12077973
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run tauri -- android build --debug --apk --target aarch64

      - name: Verify APK metadata
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='com.youyou.tauri_notes'"
          "$AAPT" dump badging "$APK" | grep "launchable-activity"

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-notes-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error